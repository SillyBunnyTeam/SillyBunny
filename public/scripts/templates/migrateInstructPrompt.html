<!-- SillyBunny: the confirm's response is "Import", so the heading asks the question and the body does not explain "Yes" and "No". -->
<h3>
    Import the Template’s System Prompt?
</h3>
<div>
    This instruct template also contains a system prompt. Importing saves it as “[Migrated] {{name}}” and selects it. Otherwise it is left out, and your current system prompt stays.
</div>
{{#if existing}}
<div class="marginTopBot5">
    <b>Note:</b>
    <span>you already have this prompt saved as:</span>
    <span>{{existing}}</span>
</div>
{{/if}}
<textarea class="wide100p textarea_compact" rows="10">{{prompt}}</textarea>
