{{#each images}}
<!-- SillyBunny: the tile is not a control, so the buttons in it are not nested in one. Its image is the button that sets the sprite; the four actions are buttons whose tooltip is also their name (native buttons answer Enter and Space themselves). -->
<div class="expression_list_item" role="listitem" data-expression="{{../expression}}" data-expression-type="{{this.type}}" data-filename="{{this.fileName}}">
    <div class="expression_list_buttons">
        <button type="button" class="menu_button expression_list_upload" title="Upload Image" aria-label="Upload Image">
            <i class="fa-solid fa-upload" aria-hidden="true"></i>
        </button>
        {{#if this.canRegenerate}}
        <button type="button" class="menu_button expression_list_regenerate" title="Regenerate With Quick Image Gen" aria-label="Regenerate With Quick Image Gen">
            <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
        </button>
        {{/if}}
        {{#if this.canGenerate}}
        <button type="button" class="menu_button expression_list_generate" title="Generate With Quick Image Gen" aria-label="Generate With Quick Image Gen">
            <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
        </button>
        {{/if}}
        <button type="button" class="menu_button expression_list_delete" title="Delete Image" aria-label="Delete Image">
            <i class="fa-solid fa-trash" aria-hidden="true"></i>
        </button>
    </div>
    <div class="expression_list_title">
        <span>{{../expression}}</span>
        {{#if ../isCustom}}
            <small class="expression_list_custom">(custom)</small>
        {{/if}}
    </div>
    <button type="button" class="expression_list_image_container" title="{{this.title}}">
        <img class="expression_list_image" src="{{this.imageSrc}}" alt="{{this.title}}" data-epression="{{../expression}}" />
    </button>
</div>
{{/each}}
