<div id="ica--settings" class="ica--settings">
    <div class="ica--inner">
        <div class="ica--footer" data-sb-agent-global-settings>
            <div class="ds-pref-group">
                <label class="ica--profile-label">
                    <span>Default Connection Profile</span>
                    <select id="ica--connectionProfile" class="text_pole" title="Which connection profile to use when an agent does not have its own editor profile override. Leave this on the selected Connection Manager profile to follow the active profile.">
                        <option value="">Use selected connection profile</option>
                    </select>
                </label>
                <label class="ica--profile-label">
                    <span>Companion Connection Profile</span>
                    <select id="ica--companionConnectionProfile" class="text_pole" title="Which connection profile Companion agents (trackers, notes) use when they do not have their own editor profile override. Leave empty to share the default above.">
                        <option value="">Use Default Connection Profile</option>
                    </select>
                    <small class="ica--profile-help">Point this at a cheap, fast model — companions run on every reply.</small>
                </label>
            </div>
            <div class="ds-pref-group">
                <label class="ica--profile-label">
                    <span>Append Agents Execution</span>
                    <select id="ica--appendAgentsExecutionMode" class="text_pole" title="Run append-mode agents in parallel (faster, may hit rate limits) or sequentially (slower, avoids rate limits).">
                        <option value="parallel">Parallel (faster)</option>
                        <option value="sequential">Sequential (rate-limit friendly)</option>
                    </select>
                    <small class="ica--profile-help">
                        Sequential runs append-mode agents one after another in Order ascending.
                        Order is shown on each agent card.
                    </small>
                </label>
                <label class="ica--profile-label">
                    <span>Companion Execution</span>
                    <select id="ica--companionExecutionMode" class="text_pole" title="Run companion agents in parallel (faster) or sequentially (rate-limit friendly), independent of the append agents setting.">
                        <option value="parallel">Parallel (faster)</option>
                        <option value="sequential">Sequential (rate-limit friendly)</option>
                    </select>
                </label>
                <label class="checkbox_label" title="Run companion agents at the same time as post-generation passes instead of after them. Faster, but companions see the reply before post passes edit it.">
                    <input type="checkbox" id="ica--companionConcurrent" />
                    <span>Run Companions Alongside Post-Gen Passes</span>
                </label>
                <label class="ica--profile-label ica--helper-prefill-label">
                    <span>Helper Prefill Messages</span>
                    <textarea id="ica--helperPrefillMessages" class="text_pole ica--helper-prefill-field" rows="4" placeholder="[assistant] Start of helper response&#10;&#10;[system] Extra instruction"></textarea>
                    <small class="ica--profile-help">Use [system], [user], or [assistant] blocks. Text before any header is treated as [assistant].</small>
                </label>
                <label class="checkbox_label" title="Keep enabled In-Chat Agents separate between Individual chats and Group chats.">
                    <input type="checkbox" id="ica--separateRecentChats" />
                    <span>Separate Agents Between Individual and Group Chats</span>
                </label>
                <label class="checkbox_label" title="Master switch for prompt pass toasts. Per-agent notification checkboxes still decide which agents can show them.">
                    <input type="checkbox" id="ica--promptTransformShowNotifications" />
                    <span>Allow prompt pass toast notifications</span>
                </label>
                <label class="checkbox_label" title="View main LLM output before pre-generation intercept">
                    <input type="checkbox" id="ica--postMainInterceptShowMessageFirst" />
                    <span>View main LLM output before pre-generation intercept</span>
                </label>
                <label class="checkbox_label" title="Enable or disable the built-in Pathfinder submodule without disabling shared In-Chat Agents.">
                    <input type="checkbox" id="ica--pathfinderSubmoduleEnabled" />
                    <span>Enable Pathfinder submodule</span>
                </label>
            </div>
            <div id="ica--resetDefaults" class="menu_button menu_button_icon caution" title="Reset all bundled agents to their original template settings (custom agents are not affected)">
                <i class="fa-solid fa-rotate-left"></i>
                <span>Reset Bundled Agents to Defaults</span>
            </div>
        </div>

        <input type="file" id="ica--importFile" accept=".json" style="display:none" />
    </div>
</div>

<div id="ica--bulkEditPopup" class="ica--bulk-edit-popup" style="display:none">
    <div class="ica--bulk-edit-popup-content">
        <strong>Bulk Edit Selected Agents</strong>
        <p class="ica--regex-note">Choose which properties to change. Set a value to apply it; leave a field at its default to skip it.</p>
        <div class="ica--editor-row flex-container flexGap5">
            <label class="flex1">Injection Role
                <select id="ica--bulkEdit-role" class="text_pole">
                    <option value="" selected>Don't change</option>
                    <option value="0">System</option>
                    <option value="1">User</option>
                    <option value="2">Assistant</option>
                </select>
            </label>
            <label class="flex1">Phase
                <select id="ica--bulkEdit-phase" class="text_pole">
                    <option value="" selected>Don't change</option>
                    <option value="pre">Pre-generation</option>
                    <option value="post">Post-generation</option>
                    <option value="both">Both</option>
                </select>
            </label>
        </div>
        <div class="ica--editor-row flex-container flexGap5">
            <label class="flex1">Prompt Pass Mode
                <select id="ica--bulkEdit-promptMode" class="text_pole">
                    <option value="" selected>Don't change</option>
                    <option value="rewrite">Rewrite</option>
                    <option value="append">Append</option>
                </select>
            </label>
            <label class="flex1">Prompt Pass Enabled
                <select id="ica--bulkEdit-promptEnabled" class="text_pole">
                    <option value="" selected>Don't change</option>
                    <option value="true">Enabled</option>
                    <option value="false">Disabled</option>
                </select>
            </label>
        </div>
        <div class="ica--editor-row flex-container flexGap5">
            <label class="flex1">Utility Post-Process Enabled
                <select id="ica--bulkEdit-ppEnabled" class="text_pole">
                    <option value="" selected>Don't change</option>
                    <option value="true">Enabled</option>
                    <option value="false">Disabled</option>
                </select>
            </label>
            <label class="flex1">Scan World Info
                <select id="ica--bulkEdit-scan" class="text_pole">
                    <option value="" selected>Don't change</option>
                    <option value="true">Enabled</option>
                    <option value="false">Disabled</option>
                </select>
            </label>
        </div>
    </div>
</div>
