name: 🚀 Prepare Release

# Cuts release/vX.Y.Z from staging, bumps the version, records merged PRs in changelog.md,
# and opens a PR into release. Release notes and README copy are written by maintainers on that PR.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (for example 2.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: 🚀 Open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate version input
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$version"; then
            echo "Stable releases need a plain X.Y.Z version. Got: $INPUT_VERSION" >&2
            echo "Release candidates are tagged on staging directly (see release.yml)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=release/v$version" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ST_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ST_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check the release does not already exist
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists. Delete it or finish that release first." >&2
            exit 1
          fi

      - name: Bump version and update changelog ledger
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          node scripts/bump-version.js "$VERSION"
          node scripts/bump-version.js --check

          previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' origin/release 2>/dev/null || true)
          if [ -n "$previous_tag" ]; then
            node scripts/update-changelog-merged-prs.js --range "$previous_tag..HEAD" --version "v$VERSION"
          fi
          echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"

      - name: Commit and push release branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git config user.name 'reisen-bot[bot]'
          git config user.email '337429064+reisen-bot[bot]@users.noreply.github.com'
          git add package.json package-lock.json public/script.js src/endpoints/horde.js changelog.md
          git commit -m "chore: prepare v$VERSION release"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          body_file="$RUNNER_TEMP/release-pr-body.md"
          {
            echo "Release checklist for v$VERSION (previous stable: ${PREVIOUS_TAG:-none})."
            echo
            echo "- [ ] Write the changelog summary for v$VERSION in \`changelog.md\`"
            echo "- [ ] Update the README \"Latest Release\" section, then run \`bash scripts/sync-readme-mirror.sh\`"
            echo "- [ ] Record the SillyTavern base release in the changelog"
            echo "- [ ] Required checks green, including Release E2E"
            echo "- [ ] Merge with **Create a merge commit**"
            echo "- [ ] After merge: tag \`v$VERSION\` on \`release\` and push only that tag"
          } > "$body_file"
          gh pr create --base release --head "$BRANCH" --title "chore: release v$VERSION" --body-file "$body_file"
