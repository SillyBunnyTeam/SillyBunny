name: 🧾 PR Metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr-metadata:
    name: ✅ Validate PR Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Validate target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = "staging" ]; then
            exit 0
          fi

          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "staging" ] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            exit 0
          fi

          if [ "$BASE_REF" = "main" ]; then
            echo "Only the staging release branch may target main. Current source: $HEAD_REF"
          else
            echo "Pull requests must target staging. Current target: $BASE_REF"
          fi

          exit 1

      - name: Validate PR title prefix
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -Eq '^(fix|chore|feat|sync|docs)(\([^)]+\))?!?:[[:space:]].+' <<< "$PR_TITLE"; then
            echo "PR title must start with one of: fix:, chore:, feat:, sync:, docs:"
            echo "Current title: $PR_TITLE"
            exit 1
          fi
