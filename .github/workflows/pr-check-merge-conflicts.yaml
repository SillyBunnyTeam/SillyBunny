name: ⚔️ Check Merge Conflicts

on:
  # So that PRs touching the same files as the push are updated
  push:
  # Non-push events scan every open PR, so this clears `dirtyLabel` once conflicts are resolved,
  # including on fork PRs. Replaces `pull_request_target`, which GitHub blocks by default on public repos from 2026-11-02.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-merge-conflicts-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check-merge-conflicts:
    name: ⚔️ Check Merge Conflicts
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check GitHub App Configuration
        id: app-config
        env:
          ST_BOT_CLIENT_ID: ${{ vars.ST_BOT_CLIENT_ID }}
          ST_BOT_PRIVATE_KEY: ${{ secrets.ST_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$ST_BOT_CLIENT_ID" ] && [ -n "$ST_BOT_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint App Token
        if: steps.app-config.outputs.enabled == 'true'
        id: app
        # Create a GitHub App token
        # https://github.com/marketplace/actions/create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ST_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ST_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Use Built-in GitHub Token
        if: steps.app-config.outputs.enabled != 'true'
        run: echo "GitHub App credentials are not configured. Falling back to github.token."

      - name: Check Merge Conflicts
        # Label Conflicting Pull Requests
        # https://github.com/marketplace/actions/label-conflicting-pull-requests
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: '🚫 Merge Conflicts'
          repoToken: ${{ steps.app.outputs.token || github.token }}
          commentOnDirty: >
            ⚠️ This PR has conflicts that need to be resolved before it can be merged.
