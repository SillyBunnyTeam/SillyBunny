name: 🐋 Docker Image Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'default/config.yaml'
      - 'package.json'
      - 'bun.lock'
      - 'server.js'
      - 'src/server-*.js'
      - 'src/healthcheck.js'
      - 'scripts/docker-smoke*'
      - '.github/workflows/docker-smoke.yml'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: 🐋 Smoke test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build single-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: sillybunny:smoke
          cache-from: type=gha

      - name: Run Docker smoke check
        run: node scripts/docker-smoke.js sillybunny:smoke
