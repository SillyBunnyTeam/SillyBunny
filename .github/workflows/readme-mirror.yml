name: README Mirror

on:
  pull_request:
    paths:
      - README.md
      - .github/readme.md
      - scripts/sync-readme-mirror.sh
      - .github/workflows/readme-mirror.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-readme-mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify README mirror is in sync
        run: bash scripts/sync-readme-mirror.sh --check
