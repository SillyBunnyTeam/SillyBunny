name: README Mirror

on:
  pull_request:
    paths:
      - README.md
      - .github/readme.md
      - scripts/sync-readme-mirror.sh
      - .github/workflows/readme-mirror.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-readme-mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify README mirror is in sync
        run: bash scripts/sync-readme-mirror.sh --check
