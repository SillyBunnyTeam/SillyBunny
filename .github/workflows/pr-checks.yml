name: ✅ Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  block-default-user-state:
    name: ✅ Block tracked default-user state
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Ensure default-user state is not tracked
        run: |
          tracked_files="$(git ls-files 'data/default-user/**')"
          if [ -n "$tracked_files" ]; then
            echo 'Tracked files under data/default-user are not allowed.'
            echo "$tracked_files"
            exit 1
          fi

  run-eslint:
    name: ✅ Check ESLint on PR
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repository
        # Checkout
        # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Node.js
        # Setup Node.js environment
        # https://github.com/marketplace/actions/setup-node-js-environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run npm install
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests

      - name: Run ESLint on tests
        run: npm run lint --prefix tests

  run-tests:
    name: ✅ Run Unit Tests on PR
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repository
        # Checkout
        # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Node.js
        # Setup Node.js environment
        # https://github.com/marketplace/actions/setup-node-js-environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests

      - name: Run unit tests
        run: npm run test:unit --prefix tests

      - name: Check agent template versions
        # The merge ref holds only this PR's changes on top of the base branch; fork checkouts do not have it.
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=2 "https://github.com/$BASE_REPOSITORY.git" "+refs/pull/$PR_NUMBER/merge:refs/remotes/pr/merge"
          node scripts/bump-agent-template-versions.js --check --base 'refs/remotes/pr/merge^1' --head refs/remotes/pr/merge

  run-art-tests:
    name: ✅ Check Art Derive
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install root dependencies
        # The card tests load the app's card parser, whose packages come from the root node_modules.
        run: npm ci --ignore-scripts

      - name: Install art derive dependencies
        run: npm ci --ignore-scripts --prefix scripts/art

      - name: Run art derive tests
        # The tests derive the shipped art again and compare it byte for byte, so a shipped picture edited by hand fails here.
        run: npm test --prefix scripts/art

  frontend-budgets:
    name: ✅ Check Frontend Assets
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run frontend budget check
        run: npm run check:frontend-budgets

      - name: Build frontend assets
        run: npm run build:frontend

  run-bun-checks:
    name: ✅ Check Bun Runtime
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Initialize server state
        run: bun src/server-init.js

      - name: Run character index tests
        run: bun test ./tests/character-index.test.js

      - name: Run SQLite cache tests
        run: bun test ./tests/sqlite-cache.test.js

      - name: Run conversation index tests
        run: bun test ./tests/conversation-index.test.js

      - name: Run Bun runtime parity checks
        run: bun tests/runtime-parity.js --runtime bun --log-file "$RUNNER_TEMP/bun-parity-server.log"

      - name: Print Bun server log on failure
        if: failure() || cancelled()
        run: |
          if [ -f "$RUNNER_TEMP/bun-parity-server.log" ]; then
            cat "$RUNNER_TEMP/bun-parity-server.log"
          fi

      - name: Upload Bun server log on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bun-runtime-parity-log-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bun-parity-server.log
          if-no-files-found: ignore
          retention-days: 14

  run-node-checks:
    name: ✅ Check Node Runtime
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Initialize server state
        run: npm run init

      - name: Run Node runtime parity checks
        run: node tests/runtime-parity.js --runtime node --log-file "$RUNNER_TEMP/node-parity-server.log"

      - name: Print Node server log on failure
        if: failure() || cancelled()
        run: |
          if [ -f "$RUNNER_TEMP/node-parity-server.log" ]; then
            cat "$RUNNER_TEMP/node-parity-server.log"
          fi

      - name: Upload Node server log on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-runtime-parity-log-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-parity-server.log
          if-no-files-found: ignore
          retention-days: 14
