name: Bootstrap Installer Smoke

on:
  pull_request:
    branches:
      - staging
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    name: Bootstrap smoke (${{ matrix.os }}, ${{ matrix.runtime }}${{ matrix.fresh_bun && ', fresh bun' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 defaults to Bun.
          - os: ubuntu-latest
            runtime: default
            expect: bun
            fresh_bun: false
          # The genuine first-run path: hide any preinstalled Bun so
          # install-prerequisites.sh has to download it from https://bun.sh/install.
          - os: ubuntu-latest
            runtime: default
            expect: bun
            fresh_bun: true
          - os: ubuntu-latest
            runtime: node
            expect: node
            fresh_bun: false
          # macOS arm64 auto-switches to Node to dodge the Bun idle CPU bug,
          # so the default leg is a Node assertion and Bun needs an override.
          - os: macos-latest
            runtime: default
            expect: node
            fresh_bun: false
          - os: macos-latest
            runtime: bun
            expect: bun
            fresh_bun: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SILLYBUNNY_LAUNCHER: '1'
      SILLYBUNNY_SKIP_BROWSER_AUTO_LAUNCH: '1'
      SILLYBUNNY_AUTO_UPDATE: '0'
      SILLYBUNNY_USE_NODE: ${{ matrix.runtime == 'node' && '1' || '' }}
      SILLYBUNNY_USE_BUN: ${{ matrix.runtime == 'bun' && '1' || '' }}
      EXPECTED_RUNTIME: ${{ matrix.expect }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A shallow source makes the installer's clone and update spam "shallow roots" errors.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report preinstalled runtimes
        run: |
          set -euo pipefail
          for command in bun node npm; do
            if resolved="$(command -v "$command" 2>/dev/null)"; then
              echo "$command -> $resolved ($("$command" --version 2>&1 | head -n 1))"
            else
              echo "$command -> not installed"
            fi
          done

      - name: Hide preinstalled Bun so the launcher must install it
        if: matrix.fresh_bun
        run: |
          set -euo pipefail
          bun_path="$(command -v bun 2>/dev/null || true)"
          bun_dir=""
          if [[ -n "$bun_path" ]]; then
            bun_dir="$(dirname "$bun_path")"
          fi
          echo "Preinstalled Bun: ${bun_path:-none}"
          trimmed_path="$(tr ':' '\n' <<< "$PATH" | grep -v -x -F "$bun_dir" | grep -v -x -F "$HOME/.bun/bin" | paste -sd: -)"
          export PATH="$trimmed_path"
          export BUN_INSTALL="$RUNNER_TEMP/bun-fresh"
          {
            echo "PATH=$PATH"
            echo "BUN_INSTALL=$BUN_INSTALL"
          } >> "$GITHUB_ENV"
          if command -v bun >/dev/null 2>&1; then
            echo "Bun is still resolvable at $(command -v bun); this leg would not exercise the download." >&2
            exit 1
          fi
          test ! -x "$BUN_INSTALL/bin/bun"

      - name: Run install.sh against this checkout
        run: |
          set -euo pipefail
          git branch --force bootstrap-smoke HEAD
          bash scripts/bootstrap/install.sh \
            --repo "$GITHUB_WORKSPACE" \
            --ref bootstrap-smoke \
            --dir "$RUNNER_TEMP/SillyBunny" \
            --no-start
          test -f "$RUNNER_TEMP/SillyBunny/server.js"
          test "$(git -C "$RUNNER_TEMP/SillyBunny" rev-parse HEAD)" = "$(git rev-parse HEAD)"

      - name: Boot the installed copy through start.sh
        run: |
          set -euo pipefail
          # Fail loudly if anything already holds the port, so a readiness probe
          # cannot be satisfied by a process other than the one we launched.
          if curl --fail --silent --max-time 2 http://127.0.0.1:4444/ > /dev/null 2>&1; then
            echo "Something is already listening on port 4444 before the launcher starts." >&2
            exit 1
          fi

          log="$RUNNER_TEMP/bootstrap-smoke.log"
          cd "$RUNNER_TEMP/SillyBunny"
          bash ./start.sh > "$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          # Wait for the launcher to reach its handoff before trusting the port.
          deadline=$((SECONDS + 300))
          until grep -qF "Entering SillyBunny" "$log" 2>/dev/null; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Launcher exited before reaching the server handoff." >&2
              cat "$log" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "Launcher did not reach the server handoff within 300 seconds." >&2
              cat "$log" >&2
              exit 1
            fi
            sleep 2
          done

          while ! curl --fail --silent --max-time 2 http://127.0.0.1:4444/ > /dev/null; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Launcher exited before the server answered on port 4444." >&2
              cat "$log" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "Server did not answer on port 4444 within 300 seconds." >&2
              cat "$log" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Installed copy answered on port 4444."

          # shellcheck disable=SC2016 # single quotes are intentional; only $EXPECTED_RUNTIME should expand in node.
          node -e '
            const fs = require("node:fs");
            const marker = JSON.parse(fs.readFileSync("node_modules/.sillybunny-dependencies.json", "utf8"));
            const profile = process.env.EXPECTED_RUNTIME + "-production";
            if (!marker.profiles || !marker.profiles[profile]) {
              throw new Error(`dependency marker has no ${profile} entry: ${JSON.stringify(marker.profiles)}`);
            }
            console.log(`dependency profile ${profile} recorded for ${marker.profiles[profile].runtimeVersion || "unknown version"}`);
          '

          # The server names its own runtime in the startup banner, which beats
          # probing ps: a process name is a thread name (Node reports things like
          # "MainThread") and changes between runtime versions.
          case "$EXPECTED_RUNTIME" in
            bun) runtime_label='Bun' ;;
            node) runtime_label='Node.js' ;;
            *)
              echo "Unknown expected runtime: $EXPECTED_RUNTIME" >&2
              exit 1
              ;;
          esac
          banner="$(grep -F "SillyBunny startup on $runtime_label " "$log" | head -n 1)"
          if [[ -z "$banner" ]]; then
            echo "The server never announced a $runtime_label runtime." >&2
            cat "$log" >&2
            exit 1
          fi
          echo "$banner"

      - name: Assert the download path installed Bun
        if: matrix.fresh_bun
        run: |
          set -euo pipefail
          test -x "$BUN_INSTALL/bin/bun"
          "$BUN_INSTALL/bin/bun" --version

      - name: Rerunning install.sh updates instead of reinstalling
        run: |
          set -euo pipefail
          head_before="$(git -C "$RUNNER_TEMP/SillyBunny" rev-parse HEAD)"
          output="$(bash scripts/bootstrap/install.sh \
            --repo "$GITHUB_WORKSPACE" \
            --ref bootstrap-smoke \
            --dir "$RUNNER_TEMP/SillyBunny" \
            --no-start 2>&1)"
          printf '%s\n' "$output"
          grep -F "already installed" <<< "$output"
          test "$(git -C "$RUNNER_TEMP/SillyBunny" rev-parse HEAD)" = "$head_before"

  windows:
    name: Bootstrap smoke (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 defaults to Bun.
          - runtime: default
            expect: bun
          - runtime: node
            expect: node
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      EXPECTED_RUNTIME: ${{ matrix.expect }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run Install-SillyBunny.ps1 against this checkout
        # Windows PowerShell 5.1 is what a fresh Windows install ships with.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git branch --force bootstrap-smoke HEAD
          if ($LASTEXITCODE -ne 0) { throw "git branch failed with exit code $LASTEXITCODE" }
          $installDir = Join-Path $env:RUNNER_TEMP 'SillyBunny'
          # Capture every stream: git's clone progress on stderr must not abort a redirected run.
          $output = & .\scripts\bootstrap\Install-SillyBunny.ps1 -Repo $env:GITHUB_WORKSPACE -Ref bootstrap-smoke -Dir $installDir -NoStart *>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'Done\. Start SillyBunny') { throw 'The installer did not finish a redirected fresh install.' }
          if (-not (Test-Path (Join-Path $installDir 'server.js'))) { throw 'server.js is missing from the installed copy.' }
          $installedHead = git -C $installDir rev-parse HEAD
          $sourceHead = git rev-parse HEAD
          if ($installedHead -ne $sourceHead) { throw "Installed HEAD $installedHead does not match $sourceHead." }

      - name: Installing into the installer's own folder is refused
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $downloads = Join-Path $env:RUNNER_TEMP 'installer-folder'
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          Copy-Item .\scripts\bootstrap\Install-SillyBunny.ps1 $downloads
          $failed = $false
          try {
            & (Join-Path $downloads 'Install-SillyBunny.ps1') -Repo $env:GITHUB_WORKSPACE -Ref bootstrap-smoke -Dir $downloads -NoStart *>&1 | Out-Null
          } catch {
            $failed = $true
            if ("$_" -notmatch 'holds this installer \(Install-SillyBunny\.ps1\)') { throw "Unexpected error: $_" }
          }
          if (-not $failed) { throw 'The installer accepted its own folder as the install target.' }
          if (Test-Path (Join-Path $downloads '.git')) { throw 'The installer cloned into its own folder.' }

      - name: Boot the installed copy through Start.bat
        shell: powershell
        env:
          SILLYBUNNY_LAUNCHER: '1'
          SILLYBUNNY_SKIP_BROWSER_AUTO_LAUNCH: '1'
          SILLYBUNNY_AUTO_UPDATE: '0'
          SILLYBUNNY_USE_NODE: ${{ matrix.runtime == 'node' && '1' || '' }}
          SILLYBUNNY_USE_BUN: ${{ matrix.runtime == 'bun' && '1' || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'SillyBunny'
          $log = Join-Path $env:RUNNER_TEMP 'bootstrap-smoke.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'bootstrap-smoke.err.log'

          # Start.bat ends in `pause`; a wrapper and a redirected stdin keep it
          # from blocking forever if the launcher gives up before the server starts.
          $wrapper = Join-Path $installDir 'run-start-bat.cmd'
          @(
            '@echo off',
            "cd /d `"$installDir`"",
            "call `"$installDir\Start.bat`" < NUL",
            'exit /b %errorlevel%'
          ) | Set-Content -Path $wrapper -Encoding OEM

          $launcher = Start-Process -FilePath cmd.exe -ArgumentList '/d', '/c', "`"$wrapper`"" -RedirectStandardOutput $log -RedirectStandardError $errLog -NoNewWindow -PassThru
          try {
              $deadline = (Get-Date).AddSeconds(300)
              $ready = $false
              while ((Get-Date) -lt $deadline) {
                  if ($launcher.HasExited) {
                      Get-Content -Path $log, $errLog -ErrorAction SilentlyContinue | Write-Host
                      throw "The launcher exited with code $($launcher.ExitCode) before the server answered on port 4444."
                  }
                  try {
                      $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4444/' -UseBasicParsing -TimeoutSec 2
                      if ($response.StatusCode -eq 200) { $ready = $true; break }
                  } catch {
                      Start-Sleep -Seconds 2
                  }
              }
              if (-not $ready) {
                  Get-Content -Path $log, $errLog -ErrorAction SilentlyContinue | Write-Host
                  throw 'Installed copy did not answer on port 4444 within 300 seconds.'
              }
              Write-Host 'Installed copy answered on port 4444.'

              $expectedProfile = "$env:EXPECTED_RUNTIME-production"
              $markerPath = Join-Path $installDir 'node_modules\.sillybunny-dependencies.json'
              if (-not (Test-Path $markerPath)) { throw "Dependency marker $markerPath is missing." }
              $marker = Get-Content -Raw -Path $markerPath | ConvertFrom-Json
              # Profiles are keyed by a hyphenated name, so index the properties
              # rather than relying on dotted access.
              $profileEntry = $null
              if ($marker.profiles) {
                  $profileEntry = $marker.profiles.PSObject.Properties[$expectedProfile].Value
              }
              if (-not $profileEntry) {
                  throw "Dependency marker has no $expectedProfile entry: $($marker.profiles | ConvertTo-Json -Compress)"
              }
              Write-Host "Dependency profile $expectedProfile recorded for $($profileEntry.runtimeVersion)."

              # The server names its own runtime in the startup banner, which beats
              # probing process names: those are thread names, not runtime identity.
              $runtimeLabel = switch ($env:EXPECTED_RUNTIME) {
                  'bun' { 'Bun' }
                  'node' { 'Node.js' }
                  default { throw "Unknown expected runtime: $env:EXPECTED_RUNTIME" }
              }
              $banner = $null
              if (Test-Path -Path $log) {
                  $banner = Get-Content -Path $log |
                      Where-Object { $_ -like "*SillyBunny startup on $runtimeLabel *" } |
                      Select-Object -First 1
              }
              if (-not $banner) {
                  Get-Content -Path $log, $errLog -ErrorAction SilentlyContinue | Write-Host
                  throw "The server never announced a $runtimeLabel runtime."
              }
              Write-Host $banner
          } finally {
              if (-not $launcher.HasExited) { taskkill /PID $launcher.Id /T /F | Out-Null }
          }

      - name: Rerunning the installer updates instead of reinstalling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'SillyBunny'
          $headBefore = git -C $installDir rev-parse HEAD
          # The installer reports through Write-Host, which is the information
          # stream; 2>&1 would drop it and the match below would never fire.
          $output = & .\scripts\bootstrap\Install-SillyBunny.ps1 -Repo $env:GITHUB_WORKSPACE -Ref bootstrap-smoke -Dir $installDir -NoStart *>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'already installed') { throw 'Rerunning the installer did not report an existing install.' }
          $headAfter = git -C $installDir rev-parse HEAD
          if ($headAfter -ne $headBefore) { throw "Rerunning the installer moved HEAD from $headBefore to $headAfter." }
